services:
  - type: web
    name: rehabilitation-center-expense-tracker-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_S3_BUCKET
        value: expense-proofs
      - key: EMAIL_API_URL
        value: https://script.google.com/macros/s/AKfycbwBFlwZ-xXgjGXg2_jlsek2tm4nkIHuPn9WsOl4HV1onANS3Z7PLGou76Hl-TURuDtE/exec
      - key: EMAIL_API_KEY
        value: MyEmailApi
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: DAILY_EMAIL_REPORT_CRON
        value: "0 6 * * *"
      - key: DAILY_EMAIL_REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: MONTHLY_EMAIL_REPORT_CRON
        value: "0 6 1 * *"
      - key: MONTHLY_EMAIL_REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: WEEKLY_EMAIL_REPORT_CRON
        value: "0 6 * * 0"
      - key: WEEKLY_EMAIL_REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: YEARLY_EMAIL_REPORT_CRON
        value: "0 6 1 1 *"
      - key: YEARLY_EMAIL_REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ORGANIZATION_NAME
        value: Rehabilitation Center
      - key: ORGANIZATION_LOGO_URL
        value: ""
      - key: WAAPI_TOKEN
        sync: false
      - key: WAAPI_INSTANCE_ID
        value: "105506"
      - key: WHATSAPP_OTP_TTL_MINUTES
        value: "5"
      - key: WHATSAPP_OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: WHATSAPP_OTP_MAX_ATTEMPTS
        value: "5"
