name: Build Android APK

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"

  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x frontend/android/gradlew

      - name: Calculate Android version
        id: version
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.${VERSION_CODE}"

          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          echo "Android versionCode: ${VERSION_CODE}"
          echo "Android versionName: ${VERSION_NAME}"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/release.keystore

      - name: Build Release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE="$VERSION_CODE" \
            -PAPP_VERSION_NAME="$VERSION_NAME" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/frontend/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Remove release keystore
        if: always()
        run: |
          rm -f frontend/android/app/release.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-expenses-release-apk-${{ env.VERSION_NAME }}
          path: frontend/android/app/build/outputs/apk/release/*.apk


