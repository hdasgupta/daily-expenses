name: Build Android APK

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Calculate unified commit version (YYYY.MM.DD.HH.mm IST)
        run: |
          VERSION_INFO=$(node -e '
            const { execSync } = require("node:child_process");
            let epochSec = Math.floor(Date.now() / 1000);
            try {
              const out = execSync("git log -1 --format=%ct").toString().trim();
              const parsed = Number.parseInt(out, 10);
              if (Number.isFinite(parsed) && parsed > 0) epochSec = parsed;
            } catch {}
            const parts = new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Kolkata",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            }).formatToParts(new Date(epochSec * 1000));
            const map = Object.fromEntries(parts.map((p) => [p.type, p.value]));
            const hour = map.hour === "24" ? "00" : map.hour;
            const versionName = `${map.year}.${map.month}.${map.day}.${hour}.${map.minute}`;
            const versionCode = Math.floor(epochSec / 60);
            console.log(`${versionName}|${versionCode}`);
          ')
          VERSION_NAME="${VERSION_INFO%%|*}"
          VERSION_CODE="${VERSION_INFO##*|}"

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"

          echo "Unified versionName (web & Android): ${VERSION_NAME}"
          echo "Android versionCode (epoch minutes): ${VERSION_CODE}"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Gradle distribution is available
        run: |
          mkdir -p frontend/android/gradle/wrapper
          
          # List of direct CDN endpoints and mirrors for Gradle 8.13
          URLS=(
            "https://downloads.gradle-dn.com/distributions/gradle-8.13-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip"
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.13-bin.zip"
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip"
          )
          
          DOWNLOADED=false
          for url in "${URLS[@]}"; do
            echo "Attempting to download Gradle from $url..."
            if curl -fSL --connect-timeout 20 --max-time 300 --retry 3 --retry-delay 3 "$url" -o frontend/android/gradle/wrapper/gradle-8.13-bin.zip; then
              echo "Successfully downloaded Gradle 8.13 from $url"
              DOWNLOADED=true
              break
            else
              echo "Download from $url failed or timed out, trying next mirror..."
            fi
          done

          if [ "$DOWNLOADED" = "true" ] && [ -s frontend/android/gradle/wrapper/gradle-8.13-bin.zip ]; then
            echo "Setting distributionUrl to local wrapper zip..."
            sed -i 's|distributionUrl=.*|distributionUrl=gradle-8.13-bin.zip|' frontend/android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's|validateDistributionUrl=.*|validateDistributionUrl=false|' frontend/android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "Could not download from mirrors; falling back to direct CDN in gradle-wrapper.properties"
          fi
          cat frontend/android/gradle/wrapper/gradle-wrapper.properties

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle Maven Central mirrors (avoid 429 rate limits)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'GRADLE_INIT' > ~/.gradle/init.d/mirrors.gradle
          allprojects {
              buildscript {
                  repositories {
                      def m1 = maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                      def m2 = maven { url 'https://maven-central.storage-download.googleapis.com/repos/central/data/' }
                      remove(m1)
                      remove(m2)
                      addFirst(m2)
                      addFirst(m1)
                  }
              }
              repositories {
                  def m1 = maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  def m2 = maven { url 'https://maven-central.storage-download.googleapis.com/repos/central/data/' }
                  remove(m1)
                  remove(m2)
                  addFirst(m2)
                  addFirst(m1)
              }
          }
          GRADLE_INIT

      - name: Make Gradle executable
        run: chmod +x frontend/android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > frontend/android/app/release.keystore

          test -f frontend/android/app/release.keystore

      - name: Build Release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILT=false
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace \
              -Pkotlin_version="2.0.21" \
              -PkotlinVersion="2.0.21" \
              -PAPP_VERSION_CODE="$VERSION_CODE" \
              -PAPP_VERSION_NAME="$VERSION_NAME" \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/frontend/android/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"; then
              BUILT=true
              break
            fi
            SLEEP_SEC=$((attempt * 15))
            echo "Gradle build attempt ${attempt} failed; retrying in ${SLEEP_SEC}s..."
            sleep "${SLEEP_SEC}"
          done
          if [ "$BUILT" != "true" ]; then
            echo "Gradle assembleRelease failed after 3 attempts."
            exit 1
          fi

      - name: Locate and rename APK
        run: |
          APK_SOURCE="frontend/android/app/build/outputs/apk/release/app-release.apk"
          APK="frontend/android/app/build/outputs/apk/release/daily-expenses-${VERSION_NAME}.apk"

          echo "Checking for APK..."

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK was not found at:"
            echo "$APK_SOURCE"
            echo ""
            echo "APK files found:"
            find frontend/android/app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi

          mv "$APK_SOURCE" "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify APK
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK does not exist:"
            echo "$APK_PATH"
            exit 1
          fi

          echo "Verified APK:"
          ls -lh "$APK_PATH"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-expenses-${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          echo "Creating release ${TAG}"
          echo "Uploading APK: ${APK_PATH}"

          # Retry release creation (handles transient GitHub API HTTP 500s & re-runs)
          RELEASE_READY=false
          for attempt in 1 2 3 4; do
            if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists."
              RELEASE_READY=true
              break
            fi

            if [ "$attempt" -le 2 ]; then
              if gh release create "${TAG}" \
                --repo "${{ github.repository }}" \
                --title "Daily Expenses ${TAG}" \
                --generate-notes; then
                RELEASE_READY=true
                break
              fi
            else
              # Fallback without --generate-notes in case GitHub's notes generator caused HTTP 500
              if gh release create "${TAG}" \
                --repo "${{ github.repository }}" \
                --title "Daily Expenses ${TAG}" \
                --notes "Automated Android APK release ${TAG}"; then
                RELEASE_READY=true
                break
              fi
            fi

            SLEEP_SEC=$((attempt * 10))
            echo "Release creation attempt ${attempt} failed; retrying in ${SLEEP_SEC}s..."
            sleep "${SLEEP_SEC}"
          done

          if [ "$RELEASE_READY" != "true" ]; then
            echo "Failed to create or locate GitHub Release ${TAG} after retries."
            exit 1
          fi

          # Retry APK upload separately with --clobber
          UPLOADED=false
          for attempt in 1 2 3 4; do
            if gh release upload "${TAG}" "${APK_PATH}" \
              --repo "${{ github.repository }}" \
              --clobber; then
              UPLOADED=true
              break
            fi
            SLEEP_SEC=$((attempt * 10))
            echo "APK upload attempt ${attempt} failed; retrying in ${SLEEP_SEC}s..."
            sleep "${SLEEP_SEC}"
          done

          if [ "$UPLOADED" != "true" ]; then
            echo "Failed to upload APK to release ${TAG} after retries."
            exit 1
          fi

          echo "Release ${TAG} created and APK uploaded successfully."

      - name: Remove release keystore
        if: always()
        run: |
          rm -f frontend/android/app/release.keystore
