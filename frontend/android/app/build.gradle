apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "org.wbfmh.dailyexpenses"

    compileSdk = rootProject.ext.compileSdkVersion

    def automaticVersionCode = project.findProperty("APP_VERSION_CODE") ?: "1"
    def automaticVersionName = project.findProperty("APP_VERSION_NAME") ?: "1.0"

    defaultConfig {
        applicationId "org.wbfmh.dailyexpenses"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode automaticVersionCode.toInteger()
        versionName automaticVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    signingConfigs {
        release {
            def signingStoreFile =
                project.findProperty("android.injected.signing.store.file")

            def signingStorePassword =
                project.findProperty("android.injected.signing.store.password")

            def signingKeyAlias =
                project.findProperty("android.injected.signing.key.alias")

            def signingKeyPassword =
                project.findProperty("android.injected.signing.key.password")

            if (signingStoreFile &&
                signingStorePassword &&
                signingKeyAlias &&
                signingKeyPassword) {

                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds use the standard Android debug signing key.
        }

        release {
            minifyEnabled false
            shrinkResources false

            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    /*
     * Android Credential Manager.
     *
     * Used by CredentialVault.kt for:
     * - CredentialManager
     * - CreatePasswordRequest
     * - GetPasswordOption
     * - GetCredentialRequest
     * - PasswordCredential
     */
    implementation "androidx.credentials:credentials:1.7.0-alpha03"

    implementation project(':capacitor-android')

    testImplementation "junit:junit:$junitVersion"

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
